name: Build GNUBG

on:
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: Linux
          - os: windows-latest
            artifact_name: Windows
          # Updated Intel label to avoid deprecation
          - os: macos-15-intel
            artifact_name: macOS-Intel
          # Standard Apple Silicon runner
          - os: macos-latest
            artifact_name: macOS-ARM64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      # -------------------------
      # Linux dependencies
      # -------------------------
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
          autoconf automake libtool \
          make gcc g++ \
          bison flex \
          gettext gawk \
          pkg-config \
          libglib2.0-dev \
          libreadline-dev \
          python3 python3-dev

      # -------------------------
      # macOS dependencies
      # -------------------------
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install \
            autoconf automake libtool \
            bison flex gettext gawk \
            pkg-config \
            glib \
            readline \
            python \
            ncurses \
            dylibbundler

          # GNU tools first
          echo "$(brew --prefix bison)/bin" >> $GITHUB_PATH
          echo "$(brew --prefix flex)/bin" >> $GITHUB_PATH
          echo "$(brew --prefix gettext)/bin" >> $GITHUB_PATH
          echo "$(brew --prefix gawk)/bin" >> $GITHUB_PATH
          
          # Download Standalone Relocatable Python (Adjust version/arch as needed)
          # For ARM64: apple-darwin-aarch64 | For Intel: apple-darwin-x86_64
          
          if [[ "${{ matrix.os }}" == *"intel"* ]]; then
            PYTHON_ARCH="x86_64-apple-darwin"
          else
            PYTHON_ARCH="aarch64-apple-darwin"
          fi
          
          curl -L -o python.tar.gz "https://github.com/indygreg/python-build-standalone/releases/download/20240107/cpython-3.10.13+20240107-$PYTHON_ARCH-install_only.tar.gz"
          mkdir -p python-portable
          tar -xzf python.tar.gz -C python-portable --strip-components=1

          # Add GNU tools and our portable python to PATH
          echo "$(brew --prefix bison)/bin" >> $GITHUB_PATH
          echo "$(pwd)/python-portable/bin" >> $GITHUB_PATH
          echo "CPPFLAGS=-I$(brew --prefix readline)/include" >> $GITHUB_ENV
          echo "LDFLAGS=-L$(brew --prefix readline)/lib" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=$(brew --prefix glib)/lib/pkgconfig" >> $GITHUB_ENV

      - name: Run autogen.sh
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ -f ./autogen.sh ]; then
            ./autogen.sh
          fi

      # -------------------------
      # Configure
      # -------------------------
      - name: Configure GNUBG
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ./configure \
            CPPFLAGS='-DAC_DATADIR="\"../share\"" -DAC_PKGDATADIR="\"../share/gnubg\""'

      # -------------------------
      # Configure (macOS)
      # -------------------------
      - name: Configure GNUBG (macOS Portable)
        if: runner.os == 'macOS'
        run: |
          # Capture Homebrew and Portable Python paths
          PORTABLE_PYTHON="$(pwd)/python-portable/bin/python3"
          READLINE_PATH=$(brew --prefix readline)
          GLIB_PATH=$(brew --prefix glib)

          ./configure \
            --with-python="$PORTABLE_PYTHON" \
            CPPFLAGS="-I$READLINE_PATH/include -I$(pwd)/python-portable/include -DAC_DATADIR='\"../share\"' -DAC_PKGDATADIR='\"../share/gnubg\"'" \
            LDFLAGS="-L$READLINE_PATH/lib -L$(pwd)/python-portable/lib" \
            PKG_CONFIG_PATH="$GLIB_PATH/lib/pkgconfig"

      # -------------------------
      # Build
      # -------------------------
      - name: Build
        if: runner.os != 'Windows'
        shell: bash
        run: |
          make

      # -------------------------
      # Install to staging dir
      # -------------------------
      - name: Install to staging
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          make install DESTDIR="$(pwd)/dist"
          ls -lah "$(pwd)/dist"

      # -------------------------
      # Collect artefacts
      # -------------------------
      - name: Prepare Unix artefact
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -e
          mkdir -p artifact
          cp -a dist/usr/local/* artifact/
          echo "Linux artefact layout:"
          find artifact -type d

      - name: Bundle macOS Libraries and Python
        if: runner.os == 'macOS'
        run: |
          # 1. Prepare directories
          mkdir -p artifact/lib

          install_name_tool -change "/install/lib/libpython3.10.dylib" "$(pwd)/python-portable/lib/libpython3.10.dylib" ./artifact/bin/gnubg || true
          
          dylibbundler -of -b \
            -x ./artifact/bin/gnubg \
            -x ./artifact/bin/makebearoff \
            -x ./artifact/bin/makehyper \
            -x ./artifact/bin/bearoffdump \
            -x ./artifact/bin/makeweights \
            -d ./artifact/lib/ \
            -p @executable_path/../lib/ \
            -s ./python-portable/lib \
            -s /usr/local/lib \
            -s /opt/homebrew/lib
          
          # 2. Copy the portable Python 'lib' and 'share' into the artifact
          mkdir -p artifact/python
          cp -R python-portable/lib artifact/python/
          cp -R python-portable/bin artifact/python/

          install_name_tool -change "/Library/Frameworks/Python.framework/Versions/3.14/lib/libncurses.6.dylib" "@executable_path/../lib/libncurses.6.dylib" ./artifact/bin/gnubg || true

      # -------------------------
      # Test packaged artefact
      # -------------------------
      - name: Test packaged gnubg binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -e

          if [ ! -d artifact/bin ]; then
            echo "ERROR: artifact/bin not found"
            exit 1
          fi

          # Resolve gnubg binary inside artefact
          GNUBG_BIN="$(find artifact/bin -type f -name 'gnubg*' -perm -111 | head -n 1)"

          if [ -z "$GNUBG_BIN" ]; then
            echo "ERROR: gnubg binary not found in artifact/bin"
            ls -lah artifact/bin
            exit 1
          fi

          echo "Running artifact smoke test: $GNUBG_BIN -t -q -h"
          "$GNUBG_BIN" -t -q -h

          echo "Packaged gnubg artifact smoke test passed"

      - name: Test packaged gnubg binary
        if: runner.os == 'macOS'
        run: |
          set -e
          
          # 1. Locate the binary
          GNUBG_BIN="./artifact/bin/gnubg"
          
          # 2. Tell the binary to use the BUNDLED Python, not the system one
          # This prevents the "Library not loaded" errors for Python-related libs
          export PYTHONHOME="$(pwd)/artifact/python"
          export PYTHONPATH="$(pwd)/artifact/python/lib/python3.10"
          
          echo "Running artifact smoke test: $GNUBG_BIN -t -q -h"
          "$GNUBG_BIN" -t -q -h
          
          echo "Packaged gnubg artifact smoke test passed"

      # -------------------------
      # Windows (MSYS2 MinGW build)
      # -------------------------
      - name: Setup MSYS2 MinGW
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          update: true
          msystem: MINGW64
          install: >
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-gtk3
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-python
            mingw-w64-x86_64-libxml2
            mingw-w64-x86_64-sqlite3
            mingw-w64-x86_64-gettext
            autoconf
            automake
            libtool
            make
            pkg-config
            flex
            bison

      - name: Run autogen.sh (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          ./autogen.sh

      - name: Configure GNUBG (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          CPPFLAGS='-DAC_DATADIR="\"../share\"" -DAC_PKGDATADIR="\"../share/gnubg\""' \
          ./configure \
            --prefix="$(pwd)/dist"

      - name: Build GNUBG (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          make -j$(nproc)

      - name: Install GNUBG to staging (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          make install

      # -------------------------
      # Bundle MinGW runtime DLLs
      # -------------------------
      - name: Bundle MinGW DLLs (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cd dist/bin
          ldd gnubg.exe | grep mingw64 | awk '{print $3}' | xargs -I{} cp {} .

      # -------------------------
      # Bundle Python runtime (Windows)
      # -------------------------
      - name: Bundle Python runtime (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          # 1. Create the lib directory in your distribution
          mkdir -p dist/lib/python3.12
          
          # 2. Copy the entire Python standard library from the MSYS2 environment
          # Note: Adjust 'python3.12' if the version in MSYS2 changes
          cp -r /mingw64/lib/python3.12/* dist/lib/python3.12/
          
          # 3. Clean up massive unnecessary folders to keep the zip small
          rm -rf dist/lib/python3.12/test
          rm -rf dist/lib/python3.12/config-3.12-x86_64-linux-gnu
          find dist/lib/python3.12 -name "__pycache__" -type d -exec rm -rf {} +

      # -------------------------
      # Bundle Python runtime
      # -------------------------
      - name: Bundle macOS Libraries and Python
        if: runner.os == 'macOS'
        run: |
          # 1. Prepare directories
          mkdir -p artifact/bin/libs
          mkdir -p artifact/lib
          
          # 2. Dynamically find the Python library folder on the GitHub runner
          # This ensures we find libpython and libncurses wherever they are installed
          PYTHON_LIB_DIR=$(python3 -c "import sysconfig; print(sysconfig.get_config_var('LIBDIR'))")
          echo "Found Python libraries at: $PYTHON_LIB_DIR"
          
          # 3. Bundle binary dependencies
          # We add -s "$PYTHON_LIB_DIR" so dylibbundler can find the missing ncurses/python dylibs
          dylibbundler -of -b \
            -x ./artifact/bin/gnubg \
            -x ./artifact/bin/makebearoff \
            -x ./artifact/bin/makehyper \
            -x ./artifact/bin/bearoffdump \
            -x ./artifact/bin/makeweights \
            -d ./artifact/bin/libs/ \
            -p @executable_path/libs/ \
            -s "$PYTHON_LIB_DIR" \
            -s /usr/local/lib \
            -s /opt/homebrew/lib
          
          # 4. Bundle Python Standard Library (equivalent to your Windows logic)
          PYTHON_STD_LIB=$(python3 -c "import os; print(os.path.dirname(os.__file__))")
          PYTHON_VER=$(python3 -c "import sys; print(f'python{sys.version_info.major}.{sys.version_info.minor}')")
          
          mkdir -p "artifact/lib/$PYTHON_VER"
          
          # Use rsync -avL to follow symlinks and copy actual files for portability
          rsync -avL "$PYTHON_STD_LIB/" "artifact/lib/$PYTHON_VER/" \
            --exclude "__pycache__" \
            --exclude "test" \
            --exclude "*.pyc"

      # -------------------------
      # Prepare Windows artefact
      # -------------------------
      - name: Prepare Windows artefact
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          mkdir -p artifact
          cp -a dist/* artifact/
          echo "Windows artefact layout:"
          find artifact -maxdepth 2 -type d

      # -------------------------
      # Upload artefact
      # -------------------------
      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: gnubg-${{ matrix.artifact_name }}
          path: artifact

  publish_release:
    name: Publish GitHub Release
    needs: build
    # Ensure this matches your default branch (master or main)
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Archive and Package Artifacts
        run: |
          set -e
          # Move into the artifacts directory where each matrix job created a folder
          cd artifacts
          
          # Loop through every directory (Linux, Windows, macOS-Intel, macOS-ARM64)
          for dir in */; do
            # Remove trailing slash for the zip name
            dir=${dir%/}
            echo "Archiving $dir..."
            zip -r "../$dir.zip" "$dir"
          done

      - name: Publish GitHub Release (with retry)
        uses: nick-invision/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_on: error
          command: |
            # Use a wildcard to upload all .zip files created in the previous step
            gh release create latest \
              *.zip \
              --title "GNUBG Latest Executables" \
              --notes "Automated builds for Linux, Windows, and macOS (Intel & ARM64)" 
